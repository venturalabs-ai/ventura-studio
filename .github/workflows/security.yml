name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git -e 'AKIA[0-9A-Z]{16}' -e 'ghp_[A-Za-z0-9]{36}' -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' . ; then
            echo 'Possible secret material detected' >&2
            exit 1
          fi
      - name: Reject unsupported portfolio metrics
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInEi --exclude-dir=.git --exclude='*.json' -e '100% CI protected' -e '0 critical vulnerabilities' -e '6 production-grade projects' . ; then
            echo 'Unsupported portfolio metric detected' >&2
            exit 1
          fi
